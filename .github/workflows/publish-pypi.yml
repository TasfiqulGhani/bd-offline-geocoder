name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bd-offline-geocoder
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync bundled data into Python package
        run: sh tools/sync_boundary_data.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
